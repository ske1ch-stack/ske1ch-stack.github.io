<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ske1ch.shade | Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f6f8fa; /* Світло-сірий фон GitHub */
            --accent-color: #6e7781; /* Сірий акцент для .shade */
            --primary-btn: #2da44e; /* Зелений для основної дії */
            --text-color: #24292f; /* Темно-сірий текст */
            --text-muted: #57606a; /* Приглушений текст */
            --card-bg: #ffffff; /* Білі картки */
            --card-border: #d0d7de; /* Тонка рамка */
            --card-hover: #f3f4f6; /* Колір при наведенні */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            /* Світло-сірий градієнт для об'єму */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(208, 215, 222, 0.6) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(208, 215, 222, 0.4) 0%, transparent 40%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Аватарка */
        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 10px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--card-border);
            box-shadow: 0 3px 6px rgba(0,0,0,0.05);
            background-color: #fff;
        }

        .profile-info {
            text-align: center;
        }

        .username {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .username span {
            color: var(--accent-color);
        }

        .bio {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 300px;
            line-height: 1.4;
            font-weight: 500;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 16px 20px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.2s ease-in-out;
            box-shadow: 0 1px 0 rgba(27,31,36,0.04);
        }

        .link-card:hover {
            transform: translateY(-2px);
            background: var(--card-hover);
            border-color: #1f2328;
            box-shadow: 0 3px 6px rgba(0,0,0,0.05);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .link-icon {
            font-size: 20px;
            width: 24px;
            text-align: center;
            color: var(--text-muted);
        }

        .link-text {
            font-weight: 500;
            font-size: 16px;
        }

        .link-arrow {
            opacity: 0.5;
            color: var(--text-muted);
            transition: 0.3s;
        }

        .link-card:hover .link-arrow {
            opacity: 1;
            transform: translateX(3px);
            color: var(--text-color);
        }

        /* Стиль для кнопки Прайсу */
        .link-card.price-btn {
            border-color: var(--card-border);
            background-color: #f6f8fa;
        }
        
        .link-card.price-btn .link-icon {
            color: var(--accent-color);
        }

        /* Стиль для головної кнопки (Telegram) */
        .link-card.primary {
            background-color: var(--primary-btn);
            border-color: rgba(27,31,36,0.15);
            color: #ffffff;
        }
        
        .link-card.primary:hover {
            background-color: #2c974b;
            border-color: rgba(27,31,36,0.15);
        }

        .link-card.primary .link-icon,
        .link-card.primary .link-arrow {
            color: #ffffff;
            opacity: 1;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Аватарка -->
        <div class="avatar-container">
            <img src="photo_1.jpg" alt="Avatar" class="avatar">
        </div>

        <!-- Інформація -->
        <div class="profile-info">
            <h1 class="username">ske1ch<span>.shade</span></h1>
            <p class="bio">AI Visuals | 3D Design | Motion<br>Перетворюю ідеї на візуальний контент</p>
        </div>

        <!-- Посилання -->
        <div class="links-container">
            
            <!-- 1. КНОПКА TELEGRAM (Головна дія) -->
            <a href="https://t.me/sk9tch" class="link-card primary" target="_blank">
                <div class="link-content">
                    <i class="fa-brands fa-telegram link-icon"></i>
                    <span class="link-text">Написати мені (Order)</span>
                </div>
                <i class="fa-solid fa-arrow-right link-arrow"></i>
            </a>

            <!-- 2. КНОПКА ПРАЙС-ЛИСТ -->
            <a href="price.html" class="link-card price-btn">
                <div class="link-content">
                    <i class="fa-solid fa-tag link-icon"></i>
                    <span class="link-text">Переглянути Прайс</span>
                </div>
                <i class="fa-solid fa-arrow-right link-arrow"></i>
            </a>

            <!-- 3. КНОПКА ПОРТФОЛІО -->
            <a href="https://www.behance.net/ske1ch" class="link-card" target="_blank">
                <div class="link-content">
                    <i class="fa-brands fa-behance link-icon"></i>
                    <span class="link-text">Моє Портфоліо</span>
                </div>
                <i class="fa-solid fa-arrow-right link-arrow"></i>
            </a>

            <!-- 4. КНОПКА INSTAGRAM -->
            <a href="https://instagram.com/ske1ch.shade" class="link-card" target="_blank">
                <div class="link-content">
                    <i class="fa-brands fa-instagram link-icon"></i>
                    <span class="link-text">Instagram</span>
                </div>
                <i class="fa-solid fa-arrow-right link-arrow"></i>
            </a>

            <!-- 5. КНОПКА TIKTOK -->
            <a href="#" class="link-card" target="_blank">
                <div class="link-content">
                    <i class="fa-brands fa-tiktok link-icon"></i>
                    <span class="link-text">TikTok (Backstage)</span>
                </div>
                <i class="fa-solid fa-arrow-right link-arrow"></i>
            </a>

        </div>

        <div class="footer">
            © 2026 Ske1ch Design
        </div>
    </div>

</body>
</html>
